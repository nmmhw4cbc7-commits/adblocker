<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lime AdBlocker</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <img src="icons/icon48.png" alt="logo" class="logo" />
      <h1>Lime AdBlocker</h1>
      <button id="historyToggle" class="history-icon" title="Blocked ads history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </button>
    </header>

    <div id="historyPanel" class="history-panel hidden">
      <div class="history-header">
        <h2>Blocked Ads</h2>
        <button id="clearHistoryBtn" class="clear-btn">Clear</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span id="statusLabel">Protection is on</span>
        <label class="switch">
          <input type="checkbox" id="toggleEnabled" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="stats-card">
      <div class="stat">
        <span class="stat-number" id="blockedCount">0</span>
        <span class="stat-label">requests blocked</span>
      </div>
      <button id="resetBtn" class="reset-btn">Reset count</button>
    </div>

    <div class="whitelist-card">
      <h2>Whitelist</h2>
      <p class="whitelist-hint">Domains here will not be blocked.</p>
      <div class="whitelist-add">
        <input type="text" id="whitelistInput" placeholder="example.com" />
        <button id="whitelistAddBtn" class="add-btn">Add</button>
      </div>
      <ul id="whitelistList" class="whitelist-list"></ul>
    </div>

    <footer>
      <p>Blocks common ad &amp; tracker domains using Chrome's declarativeNetRequest API.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
